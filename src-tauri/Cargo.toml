[package]
name = "marketlens"
version = "0.1.0"
description = "OKX 市场状态 + 仓位 → AI 复盘提示词生成工具（Windows / Android）"
edition = "2024"
rust-version = "1.85"

[lib]
# Android 需要 staticlib/cdylib；rlib 供桌面端与单元测试使用
name = "marketlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 只启用 sqlite 驱动：默认特性会把 MySQL/Postgres 驱动也拉进依赖图，
# 既拖慢构建也白白扩大供应链面。本应用只可能用 SQLite。
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"

# 前后端类型契约由 Rust 侧生成（设计文档 §7.4）
ts-rs = { version = "12", features = ["serde-compat"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "query",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
