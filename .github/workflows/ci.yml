name: CI

on:
  push:
    branches: [main]
    # 推 tag（形如 v0.1.0）才会走发布流程：三个平台的产物都构建成功后才创建 Release。
    # 用 tag 而不是「每次推 main 都发」——后者会攒出几十个无意义的 Release，
    # 而用户真正想要的是「这一版能装的东西在哪」。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 检查（格式 / Clippy / 测试 / 类型契约）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上链接 webkit2gtk 与 GTK，编译前必须装齐
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # cargo test 会同时触发 ts-rs 的导出测试，把 Rust 结构体写成 src/lib/types.ts
      - name: Rust 测试（含数据库迁移与类型导出）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 设计文档 §7.4：类型契约漂移必须让 CI 变红，否则前后端会悄悄对不上
      - name: 校验前后端类型契约未漂移
        run: |
          if ! git diff --exit-code -- src/lib/types.ts; then
            echo "::error::src/lib/types.ts 与 Rust 侧生成结果不一致。请本地运行 cargo test 后提交生成结果。"
            exit 1
          fi

      - name: 依赖安全审计（Rust）
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 依赖安全审计（npm）
        run: npm audit --audit-level=high

      # 签名补丁脚本改的是 CI 里临时生成的 Gradle 工程，本地跑不到，
      # 所以它的逻辑必须有自己的自测
      - name: Android 签名补丁脚本自测
        run: python3 scripts/patch_android_signing.py --self-test

  windows:
    name: Windows 打包（NSIS + MSI）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 设计文档 §14：Windows 产物为 NSIS(.exe) 与 MSI
      - name: 构建安装包
        run: npm run tauri build -- --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: marketlens-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android 打包（APK + AAB）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # `setup-android` 只装 SDK，**NDK 必须单独装**——Tauri 编译 Rust 到
      # Android 时要用 NDK 里的 clang 与 sysroot，没有它整步直接失败。
      - name: 安装 Android NDK
        run: |
          set -euo pipefail
          # 优先用固定版本（可重复构建）；不可用时回退到最新版，
          # 而不是让整条 CI 因为一个版本号失效而变红。
          PINNED="27.0.12077973"
          if sdkmanager --list 2>/dev/null | grep -q "ndk;$PINNED"; then
            NDK_VERSION="$PINNED"
          else
            NDK_VERSION=$(sdkmanager --list 2>/dev/null \
              | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' \
              | sed 's/ndk;//' | sort -V | tail -1)
            echo "::warning::固定版本 $PINNED 不可用，回退到 $NDK_VERSION"
          fi
          echo "使用 NDK $NDK_VERSION"
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # android/ 工程不入库（.gitignore），每次在 CI 里生成，保证可重复
      - name: 初始化 Android 工程
        run: npm run tauri android init

      # 分发策略：自用 APK 为主，同时产出 AAB 备用。
      #
      # 签名：release 构建**必须签名**才能安装。有 keystore secret 就签，
      # 没有就明确警告产物未签名——静默产出装不上的 APK 是最坏的结果。
      - name: 配置 Android 签名
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEY_BASE64，产物将**未签名**，无法直接安装。"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          cd src-tauri/gen/android
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEY_PASSWORD"
          } > keystore.properties
          base64 -d <<< "$KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          cd - >/dev/null
          # 打补丁失败会以非零退出（并输出 ::error::），不会静默产出未签名 APK
          python3 scripts/patch_android_signing.py \
            src-tauri/gen/android/app/build.gradle.kts
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: 构建 APK 与 AAB
        run: npm run tauri android build -- --apk --aab --split-per-abi

      # 产物存在性检查：`upload-artifact` 的 if-no-files-found 只保证「有文件」，
      # 不保证「是我们要的那几个」——这里把实际产物列出来，便于核对
      - name: 列出产物
        run: |
          set -euo pipefail
          find src-tauri/gen/android/app/build/outputs -name '*.apk' -o -name '*.aab' \
            | sort | tee /tmp/artifacts.txt
          test -s /tmp/artifacts.txt || { echo "::error::没有产出任何 APK/AAB"; exit 1; }
          if [ "${SIGNED:-false}" != "true" ]; then
            echo "::warning::产物未签名（未配置 keystore secret），无法直接安装。"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: marketlens-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  release:
    name: 发布 Release
    # 三个平台的产物都构建成功才发布——半成品 Release 比没有 Release 更糟：
    # 用户下载了 Windows 包却发现没有 Android 包，还得回来翻日志。
    needs: [check, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes 需要完整历史才能算出「上次 tag 之后的提交」

      # 版本号有三个来源，必须一致，否则 Release 名字会撒谎。
      # tauri.conf.json ↔ Cargo.toml 由 Rust 测试守住；这里再守 tag ↔ 版本号。
      - name: 校验 tag 与版本号一致
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "tag=$TAG  tauri.conf.json=$CONF  package.json=$PKG"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::tag（$TAG）与版本号不一致。发布前请把 tauri.conf.json 与 package.json 的 version 改成 $TAG，否则安装包里的版本号和 Release 名字对不上。"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 清点产物
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          # 三个平台都得有东西，否则「发布」就是发了个残缺的版本
          for platform in marketlens-windows marketlens-android; do
            if [ -z "$(find "artifacts/$platform" -type f 2>/dev/null)" ]; then
              echo "::error::缺少 $platform 的产物，拒绝发布残缺版本"
              exit 1
            fi
          done

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail

          # 带后缀的 tag（v0.1.0-beta.1）发成预发布，不占「最新版本」的位置
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          NOTES=$(mktemp)
          {
            echo "## 下载"
            echo
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            echo "| Windows | \`*-setup.exe\`（NSIS）/ \`*.msi\` |"
            echo "| Android | \`*.apk\`（按 ABI 拆分）/ \`*.aab\` |"
            echo
            echo "## 注意"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "- Android 产物**已签名**，可直接安装。"
            else
              echo "- ⚠️ Android 产物**未签名**，无法直接安装。"
              echo "  配置 \`ANDROID_KEY_BASE64\` / \`ANDROID_KEY_ALIAS\` / \`ANDROID_KEY_PASSWORD\`"
              echo "  后重新发版即可（见 \`docs/DESIGN.md\` §14.2）。"
            fi
            echo "- Windows 产物**未做代码签名**，安装时会有 SmartScreen 警告。"
            echo "- Windows 与 Android 产物**未经真机验证**，首次安装请留意。"
            echo
            echo "---"
            echo
          } > "$NOTES"

          # 用 `--notes`（不是 `--notes-file`）：gh 的帮助明确写了
          # 「Additional release notes can be prepended to automatically generated
          #  notes by using the --notes flag」，而 --notes-file 与 --generate-notes
          # 的组合没有文档保证。官方保证过的组合才用。
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat "$NOTES")" \
            --generate-notes \
            $PRERELEASE \
            $(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' -o -name '*.aab' \) | sort)

          echo "已发布：$(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
